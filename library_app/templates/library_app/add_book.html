{% extends 'library_app/base.html' %}

{% block title %}
Add Book
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>Add a New Book</h1>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="button">Add Book </button>

    </form>

</div>

{% endblock %}
