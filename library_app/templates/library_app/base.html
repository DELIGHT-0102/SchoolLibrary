{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        School Library
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'library_app/style.css' %}">

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="{% url 'home' %}"
               class="logo">
                School Library
            </a>

            <div class="nav-links">

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'book_list' %}">
                    Books
                </a>

                {% if user.is_authenticated %}

                    <a href="{% url 'add_book' %}">
                        Add Book
                    </a>

                    <a href="{% url 'profile' %}">
                        Profile
                    </a>

                    <a href="{% url 'logout' %}">
                        Logout
                    </a>

                {% else %}

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                    <a href="{% url 'register' %}">
                        Register
                    </a>

                {% endif %}

            </div>

        </div>

    </nav>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            School Library © 2026
        </p>

    </footer>

</body>
</html>
